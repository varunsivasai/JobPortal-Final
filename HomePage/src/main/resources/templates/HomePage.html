<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Job Portal - Home</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    h1 {
        margin-bottom: 30px;
    }

    .options {
        display: flex;
        gap: 50px;
    }

    .option {
        background: white;
        padding: 20px 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    .option a {
        display: block;
        margin: 10px 0;
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }

    .option a:hover {
        color: #007BFF;
    }
  </style>
</head>
<body>
<h1>Welcome to the Job Portal</h1>
<div class="options">
  <div class="option">
    <h2>Jobseeker</h2>
    <a href="/register/jobseeker">Register</a>
    <a href="/login/jobseeker">Login</a>
  </div>
  <div class="option">
    <h2>Job Recruiter</h2>
    <a href="/register/recruiter">Register</a>
    <a href="/login/recruiter">Login</a>
  </div>
</div>
</body>
</html>
