<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Job Posts</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
    h1 { color: #333; }
    table { width: 80%; margin: auto; border-collapse: collapse; background: #fff; }
    th, td { padding: 12px; border: 1px solid #ddd; }
    th { background: #4CAF50; color: white; }
    .btn { padding: 8px 15px; margin: 5px; text-decoration: none; color: white; border-radius: 5px; }
    .btn-add { background: #28a745; }
    .btn-delete { background: #dc3545; }
    .btn-back { background: #007bff; }
  </style>
</head>
<body>

<h1>Manage Job Posts</h1>

<a th:href="@{/jobs/create}" class="btn btn-add">Add New Job</a>

<table th:if="${jobs != null and !jobs.isEmpty()}">
  <thead>
  <tr>
    <th>Title</th>
    <th>Company</th>
    <th>Location</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="job : ${jobs}">
    <td th:text="${job.title}">Job Title</td>
    <td th:text="${job.company}">Company</td>
    <td th:text="${job.location}">Location</td>
    <td>
      <a th:href="@{'/jobs/delete/' + ${job.id}}" class="btn btn-delete">Delete</a>
    </td>
  </tr>
  </tbody>
</table>

<p th:if="${jobs == null or jobs.isEmpty()}">No job posts available. Add a new one!</p>

<a th:href="@{/recruiter/dashboard}" class="btn btn-back">Back to Dashboard</a>

</body>
</html>
