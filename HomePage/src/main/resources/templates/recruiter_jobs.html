<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Recruiter Job Management</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        margin: 40px;
    }
    h1 { color: #333; }
    .btn {
        display: inline-block;
        margin: 10px;
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        text-decoration: none;
        border-radius: 6px;
    }
    .btn:hover { background-color: #45a049; }
    table {
        width: 80%;
        margin: auto;
        background: white;
        border-collapse: collapse;
    }
    th, td {
        padding: 12px;
        border: 1px solid #ddd;
    }
    th {
        background-color: #4CAF50;
        color: white;
    }
    .btn-danger {
        background-color: #d9534f;
    }
    .btn-danger:hover {
        background-color: #c9302c;
    }
  </style>
</head>
<body>

<h1>Manage Job Posts</h1>

<a href="/recruiter/jobs/create" class="btn">Create New Job</a>

<table th:if="${jobs != null and !jobs.isEmpty()}">
  <thead>
  <tr>
    <th>Title</th>
    <th>Company</th>
    <th>Location</th>
    <th>Posted Date</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="job : ${jobs}">
    <td th:text="${job.title}">Job Title</td>
    <td th:text="${job.company}">Company</td>
    <td th:text="${job.location}">Location</td>
    <td th:text="${job.postedDate}">Date</td>
    <td>
      <a th:href="@{'/recruiter/jobs/edit/' + ${job.id}}" class="btn">Edit</a>
      <a th:href="@{'/recruiter/jobs/delete/' + ${job.id}}" class="btn btn-danger">Delete</a>
    </td>
  </tr>
  </tbody>
</table>

<p th:if="${jobs == null or jobs.isEmpty()}">
  No job posts yet. Create one to get started!
</p>

<div style="margin-top:20px;">
  <a href="/recruiter/dashboard" class="btn">Back to Dashboard</a>
</div>

</body>
</html>
