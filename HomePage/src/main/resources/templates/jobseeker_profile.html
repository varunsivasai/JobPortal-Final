<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Job Seeker Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center mb-4">Your Job Seeker Profile</h2>

  <div th:if="${profile == null}" class="alert alert-warning text-center">
    <p>No profile found. <a href="/profile/create" class="btn btn-primary btn-sm">Create Profile</a></p>
  </div>

  <div th:if="${profile != null}" class="card p-4 shadow">
    <p><strong>Name:</strong> <span th:text="${profile.name}"></span></p>
    <p><strong>Email:</strong> <span th:text="${profile.email}"></span></p>
    <p><strong>Job Position:</strong> <span th:text="${profile.jobPosition}"></span></p>

    <div>
      <a href="/profile/edit" class="btn btn-warning">Edit Profile</a>
      <a href="/profile/delete" class="btn btn-danger"
         onclick="return confirm('Are you sure you want to delete your profile?')">Delete Profile</a>

      <a th:if="${profile.resumePath != null}" href="/profile/download" class="btn btn-success">Download Resume</a>
      <span th:if="${profile.resumePath == null}" class="text-danger">No resume uploaded.</span>
    </div>
  </div>

  <div class="mt-4">
    <a href="/jobseeker/homepage" class="btn btn-secondary">Back to Dashboard</a>
  </div>
</div>

</body>
</html>
